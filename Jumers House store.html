<!DOCTYPE html><html lang="lo"><head><meta charset="utf-8"><title>Jumers House</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebeae6;--card:#fff;--ink:#1b3654;--mut:#6b7684;--ln:#d9d7d0;--ok:#2e7d5b;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14202e;--card:#1c2c40;--ink:#e8ecf1;--mut:#9aa7b6;--ln:#2d4058}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Lao',system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:8px 12px}
header img{height:46px;border-radius:6px}header b{font-size:17px;flex:1}
button,.b{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px}
.o{background:transparent;color:var(--ink)}.sm{padding:4px 10px;font-size:13px}.red{background:var(--bad);border-color:var(--bad);color:#fff}
main{max-width:960px;margin:0 auto;padding:12px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);margin:3px 0 8px}
label{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px}
.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.pc h4{margin:6px 0 2px;font-size:14px}.pr{font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chips button{white-space:nowrap}
.hero{text-align:center;padding:18px 0}.hero img{height:150px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.act{background:var(--ink);color:var(--bg)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}.mb{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ln)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats b{display:block;font-size:19px}
img.sl{max-width:100%;border-radius:10px}.qr{max-width:240px;display:block;margin:8px auto}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0}}
</style></head><body>

const cTotal=()=>cart.reduce((a,c)=>a+(find(c.id)?.price||0)*c.qty,0);

function img(file,max=700){return new Promise(r=>{if(!file)return r('');const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=f.result};f.readAsDataURL(file)})}
